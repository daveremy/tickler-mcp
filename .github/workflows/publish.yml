name: Publish

# npm Trusted Publisher (OIDC) — same doctrine as neuralingual-mcp: no npm token
# exists for this package and none must be minted. Publishing = push a `v*` tag
# from main. The one-time link (npmjs.com → tickler-mcp → Settings → Trusted
# Publisher → GitHub daveremy/tickler-mcp, workflow publish.yml) was set 2026-09-15.
# Why: the granular token in 1Password is scoped to @daveremy/* and 403s on this
# unscoped package (measured 2026-09-15, v1.2.0 first attempt).

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # Trusted Publishing needs npm >= 11.5; node 22 ships an older npm.
      - run: npm install -g npm@latest
      - run: npm ci
      # npm 12 blocks dependency install scripts unless package.json allowScripts lists
      # them (better-sqlite3 is). `npm rebuild` then builds the native bindings; measured
      # on the first two v1.2.0 runs: without allowScripts every DB test failed with
      # "Could not locate the bindings file", and a bare rebuild was a silent no-op.
      - run: npm rebuild better-sqlite3
      - run: npm run build
      - run: npm test
      - name: Tag must match package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json $PKG — refusing to publish."
            exit 1
          fi
      # No NODE_AUTH_TOKEN here — an explicit token overrides OIDC.
      - run: npm publish --access public
      - name: Verify the registry serves the tagged version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for i in 1 2 3 4 5 6; do
            GOT="$(npm view "tickler-mcp@$TAG" version 2>/dev/null || true)"
            [ "$GOT" = "$TAG" ] && { echo "registry serves $GOT"; exit 0; }
            sleep 10
          done
          echo "::error::registry does not serve tickler-mcp@$TAG"; exit 1
